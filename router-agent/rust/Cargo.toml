[package]
name = "router-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
ipnet = "2.12.2"
russh = { version = "0.63.3", default-features = false, features = ["ring", "flate2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
