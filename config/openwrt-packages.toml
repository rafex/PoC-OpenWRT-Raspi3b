# ============================================================================
# OpenWRT 25.12.5 Package Configuration
# ============================================================================
# Profile: tplink_tl-wdr3600-v1
# Target:  ath79/generic
# RAM:     128 MB (TL-WDR3600 v1 hardware specification; verify on device)
#
# This is the authoritative package list. The legacy config/openwrt-packages.txt
# is auto-generated from this file — do NOT edit it manually.
# ============================================================================

[metadata]
profile = "tplink_tl-wdr3600-v1"
target = "ath79/generic"
ram_mb = 128

# ============================================================================
# INCLUDED PACKAGES
# ============================================================================

[categories.ssh]
"SSH Server" = ["dropbear"]

[categories.network]
"Core Networking" = ["dnsmasq", "firewall4"]

[categories.wifi]
"Wi-Fi Dual-Band" = ["wpad-basic-mbedtls"]

[categories.tls]
"TLS / HTTPS" = [
  "uclient-fetch",
  "libustream-mbedtls",
  "ca-bundle"
]

[categories.usb]
"USB Storage" = [
  "kmod-usb-core",
  "kmod-usb2",
  "kmod-usb-ehci",
  "kmod-usb-storage",
  "kmod-usb-storage-uas",
  "kmod-scsi-core",
  "kmod-fs-ext4",
  "block-mount",
  "usign"
]
"USB Networking (tethering)" = [
  "kmod-usb-net",
  "kmod-usb-net-rndis",
  "kmod-usb-net-cdc-ether"
]

[categories.vpn]
"WireGuard VPN" = ["wireguard-tools", "kmod-wireguard"]

[categories.firewall]
"nftables Backend" = ["kmod-nft-core", "kmod-nft-nat"]

[categories.tools]
"System Tools" = []

[categories.rpcd]
"RPC Daemon (base, system services)" = [
  "rpcd",
  "rpcd-mod-file",
  "rpcd-mod-iwinfo"
]

# ============================================================================
# EXCLUDED PACKAGES
# ============================================================================

[exclusions]
"LuCI Web Interface" = [
  "luci",
  "luci-base",
  "luci-light",
  "luci-theme-bootstrap",
  "luci-app-firewall",
  "luci-app-package-manager",
  "luci-mod-admin-full",
  "luci-mod-network",
  "luci-mod-status",
  "luci-mod-system",
  "luci-proto-ipv6",
  "luci-proto-ppp"
]

"uhttpd Web Server" = [
  "uhttpd",
  "uhttpd-mod-ubus"
]

"rpcd LuCI Modules" = [
  "rpcd-mod-luci",
  "rpcd-mod-rpcsys",
  "rpcd-mod-rrdns",
  "rpcd-mod-ucode"
]

# ============================================================================
# NOTES & WARNINGS
# ============================================================================

[warnings]
tor = "Consumes 50-80 MB RAM on the 128 MB device and can still create memory pressure; removed from build."
tor_integration = "Tor runs on the Raspberry Pi 3B; OpenWRT only manages forwarding/proxy rules."
flash_limit = "TL-WDR3600 has 8 MB flash. Keep total squashfs < 5.5 MB compressed."

[notes]
usb_profiles = "Safe variant uses a signed profile volume (OPENWRT_PROFILE), never /overlay; extroot is a separate paired variant."
ca_certificates = "Removed: redundant with ca-bundle. Saves ~300 KB."
kmod_nls = "Removed kmod-nls-* and kmod-scsi-generic: only needed for FAT32/exFAT."
e2fsprogs = "Excluded from flash; included in the extroot USB image for formatting and checking other ext4 drives."
usbutils = "Excluded from flash; included in the extroot USB image for lsusb diagnostics."
logrotate = "Removed: flash space too limited; use standard syslog rotation."
htop_nano = "Removed: busybox ya incluye top y vi como editor."

# extroot variant: keep only early-boot storage support in flash. The full
# package set below is installed into the paired ext4 extroot image.
[variants.extroot]
firmware_remove = [
  "kmod-usb-net",
  "kmod-usb-net-rndis",
  "kmod-usb-net-cdc-ether",
  "usign"
]
usb_add = [
  "e2fsprogs",
  "parted",
  "usbutils",
  "rsync",
  "tcpdump",
  "bind-dig",
  "wireguard-tools",
  "kmod-wireguard"
]
